# B2 (HotFlip standalone) on the CPU cluster, reduced first campaign.
#
# Faults: seeds 0-127 per scope (256 of the 770 k=1 faults). The random
# baseline B1 covers all 385 seeds, so the B1-vs-B2 comparison stays
# paired on this shared subset (n=128/scope -> ~+-9% margins at 95%
# confidence, enough to resolve ~10-point coverage differences).
# Extending to more seeds later is additive: rerun with a larger range.
#
# Budget: 6,400 row-equivalents per fault = B1's measured per-fault spend
# (100 faulty probes at batch 8; constant across all 762 decoded faults in
# exp_random.jsonl). NOTE: the first cluster campaign ran with 25,600
# (an over-generous cap from a cumulative-vs-delta calibration slip); its
# records carry per-start rows, so matched-budget analysis is done post
# hoc by truncating each fault's start walk at 6,400 row-equivalents.
#
# Sizing (measured 2.8 row-equiv/s per 8-core task): at 6,400 rows the
# worst case per fault is ~40 min; the 25,600 cap bounds a fault at ~2.6 h.
#
# Submit:
#   CONFIG=experiments_cluster_hotflip.yaml SHARDS=16 \
#     sbatch --array=0-15 hpc/run_experiments.sh
# (raise to SHARDS=32 / --array=0-31 if you get more nodes)
# Merge afterwards: python src/run_experiments.py \
#   --config experiments_cluster_hotflip.yaml --merge

experiments:
  - name: hotflip_cluster_128
    method: hotflip
    scopes: [mantissa, exponent]
    seeds: [0, 127]
    out: results/exp_hotflip.jsonl
    args:
      hf-starts: 8
      hf-steps: 150
      hf-width: 4
      budget-rows: 6400
      m: 32
